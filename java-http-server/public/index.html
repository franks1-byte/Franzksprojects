<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniServer To-Do</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <h1>MiniServer</h1>
    <p>This page, its CSS, and the API below are all served by a Java web server written from raw sockets.</p>
  </header>

  <form id="add">
    <input id="title" placeholder="What needs doing?" autocomplete="off" maxlength="120">
    <button>Add</button>
  </form>

  <div class="filters">
    <button data-filter="" class="active">All</button>
    <button data-filter="false">Open</button>
    <button data-filter="true">Done</button>
  </div>

  <ul id="list"></ul>
  <p id="error" class="error"></p>

  <footer id="stats">loading stats…</footer>
</main>
<script src="/app.js"></script>
</body>
</html>
